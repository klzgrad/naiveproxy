syntax = "proto2";

package perfetto.protos;

// Injected into TracePacket by perfetto post-reboot recovery to record
// recovered trace metadata.
message RecoveredTraceInfo {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_UNEXPECTED_REBOOT = 1;
  }

  optional Reason reason = 1;

  // Raw trace file size (in bytes) on disk prior to post-reboot recovery.
  optional uint64 original_file_size_bytes = 2;

  // Amount of trailing corrupted/incomplete bytes truncated during recovery.
  optional uint64 bytes_truncated = 3;
}
