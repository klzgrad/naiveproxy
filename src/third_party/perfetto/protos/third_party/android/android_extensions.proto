syntax = "proto2";

package com.android.internal;

// Common definitions.
import public "protos/third_party/android/frameworks/base/proto/tracing/frameworks_base_common.proto";

// TrackEvent extensions.
import public "protos/third_party/android/frameworks/base/proto/tracing/frameworks_base_track_event.proto";
import public "protos/third_party/android/frameworks/native/tracing/frameworks_native_track_event.proto";

// InternedData extensions.
import public "protos/third_party/android/frameworks/base/proto/tracing/frameworks_base_interned_data.proto";
import public "protos/third_party/android/frameworks/native/tracing/frameworks_native_interned_data.proto";

// TracePacket extensions.
import public "protos/third_party/android/frameworks/base/proto/tracing/frameworks_base_trace_packet.proto";
import public "protos/third_party/android/frameworks/native/tracing/frameworks_native_trace_packet.proto";

// Winscope extensions (TracePacket + WinscopeExtensions fields, split per
// repo).
import public "protos/third_party/android/frameworks/native/tracing/winscope/frameworks_native_winscope.proto";
import public "protos/third_party/android/frameworks/base/proto/tracing/winscope/frameworks_base_winscope.proto";

// Bluetooth extensions.
import public "protos/third_party/android/packages/modules/bluetooth/tracing/bluetooth_trace.proto";

// Connectivity extensions.
import public "protos/third_party/android/connectivity/network_trace.proto";

// ART extensions.
import public "protos/third_party/android/art/heap_graph.proto";
